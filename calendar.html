    <script>
        // All dates go here following the format
        // { day: 'DD', month: 'MonthName', year: 2025, venue: '', venueLink: '', location: '', project: '', projectLink: '', status: 'confirmed/sold-out/tba', info: '', infoLink: '' }
        const allDates = [
            {
                day: '23',
                month: 'Nov',
                year: 2025,
                venue: 'IndieFest',
                venueLink: 'https://reopera.ca/indiefest/',
                location: 'Vancouver, Canada',
                project: 'DEPTHS',
                projectLink: 'depths.html',
                status: 'confirmed',
                info: 'Get Tickets',
                infoLink: 'https://www.eventbrite.ca/e/future-mythologies-depths-tickets-1902777782569?aff=oddtdtcreator'
            },
            {
                day: '26',
                month: 'Sept',
                year: 2025,
                venue: 'LOBE STUDIO',
                venueLink: 'https://lobestudio.ca/',
                location: 'Vancouver, Canada',
                project: 'DEPTHS',
                projectLink: 'depths.html',
                status: 'confirmed',
                info: '',
                infoLink: ''
            },
        ];

        // Function to parse date and check if it's in the past
        function isPastDate(day, month, year) {
            const months = {
                'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5,
                'Jul': 6, 'Aug': 7, 'Sept': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11
            };
            
            const eventDate = new Date(year, months[month], parseInt(day));
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            return eventDate < today;
        }

        // Function to create date entry HTML
        function createDateEntry(dateObj, isPast) {
            const statusClass = isPast ? 'status-past' : `status-${dateObj.status}`;
            const statusText = isPast ? 'Past' : (dateObj.status === 'confirmed' ? 'Confirmed' : 
                              dateObj.status === 'sold-out' ? 'Sold Out' : 'TBA');
            const pastClass = isPast ? 'past-date' : '';
            
            return `
                <div class="date-entry ${pastClass}">
                    <div style="display: flex; flex-direction: column; gap: 3px;">
                        <div class="date-day">${dateObj.day}</div>
                        <div class="date-month">${dateObj.month}</div>
                        <div class="date-year">${dateObj.year}</div>
                    </div>
                    <div class="location-column">${dateObj.location}</div>
                    <div class="venue-name"><a href="${dateObj.venueLink}" target="_blank">${dateObj.venue}</a></div>
                    <div class="project-info">
                        <div class="project-name"><a href="${dateObj.projectLink}">${dateObj.project}</a></div>
                    </div>
                    <div class="date-status ${statusClass}">${statusText}</div>
                    <div class="info-column"><a href="${dateObj.infoLink}" target="_blank">${dateObj.info}</a></div>
                </div>
            `;
        }

        // Organize and display dates
        function organizeDates() {
            const upcomingContainer = document.getElementById('upcoming-dates');
            const pastContainer = document.getElementById('past-dates');
            const pastTitle = document.getElementById('past-title');
            
            const upcomingDates = [];
            const pastDates = [];
            
            // Separate upcoming and past dates
            allDates.forEach(date => {
                if (isPastDate(date.day, date.month, date.year)) {
                    pastDates.push(date);
                } else {
                    upcomingDates.push(date);
                }
            });
            
            // Display upcoming dates
            if (upcomingDates.length > 0) {
                upcomingContainer.innerHTML = upcomingDates.map(date => 
                    createDateEntry(date, false)
                ).join('');
            } else {
                upcomingContainer.innerHTML = '<div class="no-dates-message">No upcoming dates at the moment. Check back soon!</div>';
            }
            
            // Display past dates
            if (pastDates.length > 0) {
                pastTitle.style.display = 'block';
                pastContainer.innerHTML = pastDates.map(date => 
                    createDateEntry(date, true)
                ).join('');
            }
        }

        // Mobile Menu
        function initializeMobileMenu() {
            const navContainer = document.querySelector('.nav-container');
            const navLinks = document.querySelector('.nav-links');
            
            if (!document.querySelector('.mobile-menu-toggle')) {
                const hamburger = document.createElement('button');
                hamburger.className = 'mobile-menu-toggle';
                hamburger.setAttribute('aria-label', 'Toggle mobile menu');
                hamburger.innerHTML = `
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                `;
                navContainer.appendChild(hamburger);
            }

            const hamburger = document.querySelector('.mobile-menu-toggle');

            hamburger.addEventListener('click', function() {
                this.classList.toggle('active');
                navLinks.classList.toggle('active');
                document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
            });

            const navLinkItems = document.querySelectorAll('.nav-links a');
            navLinkItems.forEach(link => {
                link.addEventListener('click', function() {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            });

            document.addEventListener('click', function(event) {
                if (!navContainer.contains(event.target) && navLinks.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && navLinks.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            organizeDates();
            initializeMobileMenu();
        });

        // Smooth scrolling
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
