    <main class="main-content">
        <!-- ---------------------------------------------------------------
             FEATURED HERO — horizontal carousel, one screen tall. Scrolling
             down goes straight to "From the Collective" below. The carousel
             only moves sideways with Shift + scroll or the arrows (desktop,
             pointer over the carousel) or a left/right swipe (touch). Projects with a
             dedicated page (`link` set in featuredData) are clickable.
        --------------------------------------------------------------- -->
        <section class="featured-hero" id="featuredHero" aria-roledescription="carousel" aria-label="Featured projects">
            <div class="featured-hero-heading">
                <h1 class="featured-hero-title">FEATURED PROJECTS</h1>
                <div class="featured-browse-hint" aria-hidden="true">
                <!--    <span class="hint-desktop">SHIFT + SCROLL TO BROWSE</span> -->
                    <span class="hint-touch">SWIPE TO BROWSE</span>
                </div>
            </div>
            <div class="featured-viewport">
                <div class="featured-track" id="featuredTrack">
                    <!-- Slides (pictures) injected by JS from featuredData below -->
                </div>
                <div class="featured-captions" id="featuredCaptions">
                    <!-- Name/subtitle per project, injected by JS — these fade
                         in/out instead of sliding with the pictures -->
                </div>
            </div>
            <!-- Prev/next arrows, centred on the left/right edges. Hidden on
                 mobile (swipe instead) via the CSS. -->
            <button class="featured-arrow prev" id="featuredPrev" type="button" aria-label="Previous project">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button class="featured-arrow next" id="featuredNext" type="button" aria-label="Next project">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
            <div class="scroll-indicator" id="scrollIndicator" aria-hidden="true">
                <span class="scroll-indicator-label">SCROLL DOWN <br> TO SEE MORE PROJECTS</span>
                <svg class="scroll-indicator-arrow" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <!-- Progress dots, lower-right corner -->
            <div class="featured-controls">
                <div class="featured-dots" id="featuredDots" aria-hidden="true">
                    <!-- One dot per project, injected by JS in buildFeaturedHero -->
                </div>
            </div>
        </section>

        <!-- ---------------------------------------------------------------
             MORE PROJECTS — hover-reveal grid, everything not featured
             above. Hover any tile to see a short description; click opens

                lightboxSrc: "https://player.vimeo.com/video/1176342540?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479",
                credits: [

            },
            {
                title: "MARATHON REVEAL CINEMATIC",

                description: "A team-based extraction shooter. Choose your Runner and scavenge the lost colony of Tau Ceti IV for fortune, power, and answers to Tau Ceti's secrets.",

            {

                src: "Media/BioShock/BioShock.webp",
                description: "BioShock 2 follows Subject Delta, a prototype Big Daddy fighting through the ruined underwater city of Rapture. He must rescue his former Little Sister, Eleanor, from her mother, Sofia Lamb, who now controls the city's cult-like survivors.",
                explore: false,

            },
            {
                title: "The First Berserker Khazan",
                subtitle: "VIDEO GAME TRAILER SOUND RE-DESIGN",
                type: "image",
                src: "Media/Khazan/Khazan.webp",
                description: "The First Berserker: Khazan is a hardcore action RPG based on DNF (Dungeon & Fighter) Universe that will be available on PlayStation 5. As Khazan, the great general of the Pell Los Empire who overcame death, players will unveil the incidents that led to his downfall and seek vengeance on his enemies.",
                explore: false,
                link: "",
                lightboxType: "vimeo",
                lightboxSrc: "https://www.youtube.com/embed/-6hEc8oXvuU?si=Zt8G0n6EtzWKfTSm",
                credits: [
                    ["Axel Braaten", "Sound Designer & Re-Recording Mixer"]
                ]
            }
        ];

        // ---------------------------------------------------------------
        // SHARED HELPER — renders the media element (img/video/iframe) for
        // any project object, used by the featured hero, the grid and the
        // lightbox.
        //
        // opts.eager = true  -> load immediately (used only for the very
        //                       first featured project, which is on screen
        //                       the moment the page opens)
        // otherwise          -> images are lazy-loaded and videos use
        //                       preload="none", so nothing downloads until
        //                       it's actually needed.
        //
        // Videos no longer carry the `autoplay` attribute — playback is
        // started/stopped explicitly by goToFeatured() below, so only the
        // project currently on screen ever plays.
        // ---------------------------------------------------------------
        // ---------------------------------------------------------------
        // MOBILE MEDIA — on screens 768px wide or less, images and videos
        // load a smaller "-mobile" copy instead of the full-size file:
        //   Media/KT/KT.webp                        -> Media/KT/KT-mobile.webp
        //   Media/TUW/TUW.avif                      -> Media/TUW/TUW-mobile.webp
        //   Media/Depths/DepthsVisuals_Stevo_3.mp4  -> Media/Depths/DepthsVisuals_Stevo_3-mobile.mp4
        // (Mobile images are always .webp; mobile videos always .mp4.)
        //
        // You never type these paths — they're worked out automatically
        // from `src`. If a -mobile file doesn't exist yet, the page quietly
        // falls back to the full-size file (see the error handler below),
        // so nothing breaks while you're still generating them.
        // Set USE_MOBILE_MEDIA to false to switch the whole thing off.
        // ---------------------------------------------------------------
        const USE_MOBILE_MEDIA = true;
        const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;

        function mobileSrc(src, type) {
            if (!USE_MOBILE_MEDIA || !IS_MOBILE) return src;
            if (!src || /^https?:\/\//.test(src)) return src; // only our own files
            const dot = src.lastIndexOf('.');
            if (dot === -1) return src;
            const base = src.slice(0, dot);
            if (base.endsWith('-mobile')) return src;
            return base + (type === 'video' ? '-mobile.mp4' : '-mobile.webp');
        }

        // IMAGES: if a "-mobile" image is missing, swap in the full-size
        // original. (Capture phase catches errors from every <img> on the
        // page, including ones added later.) Also a safety net for videos.
        document.addEventListener('error', (e) => {
            const el = e.target;
            if (!(el instanceof HTMLImageElement || el instanceof HTMLVideoElement)) return;
            const full = el.dataset.full;
            if (!full || el.dataset.fellBack) return;
            el.dataset.fellBack = '1';
            el.src = full;
            // A featured video that's currently on screen should keep playing.
            if (el instanceof HTMLVideoElement &&
                (el.closest('.featured-space.is-active') || el.closest('#lightboxMedia'))) {
                const p = el.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            }
        }, true);

        function renderMedia(slide, className, opts = {}) {
            if (slide.type === 'video') {
                const poster = slide.poster ? ` poster="${slide.poster}"` : '';
                const preload = opts.eager ? 'auto' : 'none';
                const mobile = mobileSrc(slide.src, 'video');
                // On phones the video starts WITHOUT a src; resolveVideoSources()
                // checks whether the -mobile file exists and then sets the
                // right one. (Relying on a load error to fall back isn't
                // reliable for video on every phone browser.)
                if (mobile !== slide.src) {
                    return `<video class="${className}" data-mobile="${mobile}" data-full="${slide.src}" muted loop playsinline preload="${preload}"${poster}></video>`;
                }
                return `<video class="${className}" src="${slide.src}" muted loop playsinline preload="${preload}"${poster}></video>`;
            }
            if (slide.type === 'vimeo' || slide.type === 'youtube' || slide.type === 'embed') {
                return `<iframe class="${className}" src="${slide.src}" loading="lazy" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" allowfullscreen title="${slide.title}"></iframe>`;
            }
            const loading = opts.eager ? 'eager' : 'lazy';
            const src = mobileSrc(slide.src, 'image');
            const full = src !== slide.src ? ` data-full="${slide.src}"` : '';
            return `<img class="${className}" src="${src}"${full} alt="${slide.title}" loading="${loading}" decoding="async">`;
        }

        // Phones only: for each video waiting on a source, ask the server
        // whether its -mobile file exists, then use it — or the full-size
        // file if not — and start playing if it's the one on screen.
        function resolveVideoSources(root) {
            root.querySelectorAll('video[data-mobile]').forEach((video) => {
                const mobile = video.dataset.mobile;
                const full = video.dataset.full;
                video.removeAttribute('data-mobile');
                fetch(mobile, { method: 'HEAD', cache: 'no-store' })
                    .then((res) => (res.ok ? mobile : full))
                    .catch(() => full)
                    .then((src) => {
                        video.dataset.fellBack = '1'; // already decided; no more swapping
                        video.src = src;
                        const onScreen = (video.closest('.featured-space.is-active') && heroInView)
                            || video.closest('#lightboxMedia');
                        if (onScreen) {
                            const p = video.play();
                            if (p && typeof p.catch === 'function') p.catch(() => {});
                        }
                    });
            });
        }

        function renderCreditsRows(credits) {
            return credits.map(([name, role]) => `
                <div class="credit-row">
                    <a class="credit-name" href="${creditLink(name)}">${name}</a>
                    <span class="credit-role">${role}</span>
                </div>
            `).join('');
        }

        // Shared helper — builds the EXPLORE + VIEW ON IMDB buttons for a
        // project object, used in the lightbox.
        function renderActionButtons(project) {
            const exploreBtn = project.explore && project.link
                ? `<a href="${project.link}" class="btn-explore">EXPLORE</a>`
                : '';

            const imdbBtn = project.imdb
                ? `<a href="${project.imdb}" target="_blank" rel="noopener" class="btn-explore">VIEW ON IMDB</a>`
                : '';

            return exploreBtn + imdbBtn;
        }

        // ---------------------------------------------------------------
        // FEATURED HERO — horizontal carousel
        //
        // All projects sit side by side in #featuredTrack; goToFeatured()
        // slides the track sideways. The hero is a normal one-screen
        // section, so plain vertical scrolling just scrolls the page on to
        // "From the Collective" — it's never intercepted.
        //
        // The carousel moves on its own every AUTOPLAY_MS (see below), and
        // by hand ONLY on:
        //   - the prev/next arrows (desktop).
        //   - Shift + scroll wheel over the carousel (desktop). A sideways
        //     trackpad swipe also works, since that's the same intent.
        //   - a left/right swipe on touch screens.
        // One gesture = one project, and it stops at the first/last
        // project (non-cyclic).
        // ---------------------------------------------------------------
        const featuredHero = document.getElementById('featuredHero');
        const featuredTrack = document.getElementById('featuredTrack');
        const featuredDots = document.getElementById('featuredDots');
        const featuredCaptions = document.getElementById('featuredCaptions');
        const featuredPrev = document.getElementById('featuredPrev');
        const featuredNext = document.getElementById('featuredNext');

        // Keep in sync with the .featured-track transition in the CSS.
        const SLIDE_MS = 800;

        // AUTOPLAY — moves to the next project every AUTOPLAY_MS
        // (8000 = 8 seconds; set 5000 for 5 seconds). After the last
        // project it fades back to the first instead of sliding back
        // across all of them. The countdown starts over whenever someone
        // changes project themselves or scrolls the page, so the carousel
        // never jumps right after someone interacts. Autoplay pauses while
        // the carousel is scrolled out of view and while the browser tab
        // is in the background.
        const AUTOPLAY_MS = 8000;
        // Keep in sync with the .featured-viewport transition in the CSS.
        const WRAP_FADE_MS = 500;

        const featuredViewport = document.querySelector('.featured-viewport');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let autoplayTimer = null;
        let wrapping = false;

        let featuredIndex = 0;
        let featuredSpaces = [];
        let featuredDotEls = [];
        let featuredCaptionEls = [];
        let heroInView = true;

        function playVideo(video) {
            if (video && video.paused) {
                const p = video.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            }
        }

        function canAutoplay() {
            return featuredSpaces.length > 1
                && !reducedMotion
                && heroInView
                && !wrapping
                && !document.hidden
                && !document.body.classList.contains('lightbox-open');
        }

        // (Re)starts the countdown to the next automatic change.
        function scheduleAutoplay() {
            clearTimeout(autoplayTimer);
            if (!canAutoplay()) return;
            autoplayTimer = setTimeout(autoAdvance, AUTOPLAY_MS);
        }

        function autoAdvance() {
            if (!canAutoplay()) return;
            if (featuredIndex < featuredSpaces.length - 1) {
                goToFeatured(featuredIndex + 1);
            } else {
                wrapToStart();
            }
        }

        // Last project -> first: fade the picture out, jump back to the
        // start while it's invisible, then fade it in again.
        function wrapToStart() {
            wrapping = true;
            featuredViewport.classList.add('is-fading');
            setTimeout(() => {
                goToFeatured(0, true);
                featuredViewport.classList.remove('is-fading');
                wrapping = false;
                scheduleAutoplay();
            }, WRAP_FADE_MS);
        }

        function setupAutoplay() {
            // Scrolling the page restarts the full countdown, so the
            // carousel never switches right after someone scrolls.
            window.addEventListener('scroll', scheduleAutoplay, { passive: true });
            // Pause while the tab is in the background.
            document.addEventListener('visibilitychange', scheduleAutoplay);
            scheduleAutoplay();
        }

        function buildFeaturedHero() {
            featuredTrack.innerHTML = '';
            featuredDots.innerHTML = '';
            featuredCaptions.innerHTML = '';

            featuredData.forEach((project, i) => {
                const space = document.createElement('div');
                space.className = 'featured-space';

                // Featured still images load up front (they sit off-screen
                // until slid to, so lazy-loading would leave them blank on
                // arrival). Videos stay deferred except the first — its
                // neighbours are preloaded ahead of time by goToFeatured().
                const mediaEl = renderMedia(project, 'featured-media', { eager: i === 0 || project.type === 'image' });
                const hasLink = Boolean(project.link);

                const mediaBlock = hasLink
                    ? `<a class="featured-media-wrapper" href="${project.link}" aria-label="Explore ${project.title}" draggable="false">
                           ${mediaEl}
                       </a>`
                    : `<div class="featured-media-wrapper">${mediaEl}</div>`;

                const exploreHint = hasLink
                    ? `<span class="featured-explore-hint">Click to explore project</span>`
                    : '';

                // The slide holds only the picture; its text goes in a
                // separate caption so it fades rather than slides.
                space.innerHTML = mediaBlock;
                featuredTrack.appendChild(space);

                const caption = document.createElement('div');
                caption.className = 'featured-caption';
                // Optional photo credit — plain text, or a link if
                // photoCreditLink is set.
                let photoCredit = '';
                if (project.photoCredit) {
                    photoCredit = project.photoCreditLink
                        ? `<a class="featured-photo-credit" href="${project.photoCreditLink}" target="_blank" rel="noopener">${project.photoCredit}</a>`
                        : `<span class="featured-photo-credit">${project.photoCredit}</span>`;
                }

                caption.innerHTML = `
                    <h2 class="featured-name">${project.title}</h2>
                    <p class="featured-subtitle">${project.subtitle}</p>
                    ${exploreHint}
                    ${photoCredit}
                `;
                featuredCaptions.appendChild(caption);

                const dot = document.createElement('span');
                dot.className = 'featured-dot';
                featuredDots.appendChild(dot);
            });

            featuredSpaces = Array.from(featuredTrack.children);
            featuredDotEls = Array.from(featuredDots.children);
            featuredCaptionEls = Array.from(featuredCaptions.children);

            resolveVideoSources(featuredTrack);
            goToFeatured(0, true);
            setupFeaturedInput();
            setupHeroVisibility();
            setupAutoplay();
        }

        // Moves the carousel to `index` and handles everything tied to the
        // active project: dots, video playback (only the active project's
        // video plays) and preloading the neighbouring videos so they're
        // ready before they slide in.
        function goToFeatured(index, instant) {
            const max = featuredSpaces.length - 1;
            index = Math.max(0, Math.min(max, index));
            featuredIndex = index;

            if (instant) featuredTrack.style.transition = 'none';
            featuredTrack.style.transform = `translateX(-${index * 100}%)`;
            if (instant) {
                void featuredTrack.offsetHeight; // apply without animating
                featuredTrack.style.transition = '';
            }

            featuredSpaces.forEach((space, i) => {
                const isOn = i === index;
                space.classList.toggle('is-active', isOn);
                space.setAttribute('aria-hidden', isOn ? 'false' : 'true');
                // Off-screen projects' links shouldn't be reachable by Tab.
                space.querySelectorAll('a').forEach(a => {
                    if (isOn) a.removeAttribute('tabindex');
                    else a.setAttribute('tabindex', '-1');
                });

                const video = space.querySelector('video');
                if (!video) return;

                if (Math.abs(i - index) === 1 && video.preload === 'none') {
                    video.preload = 'auto';
                    video.load();
                }

                if (isOn && heroInView) {
                    playVideo(video);
                } else if (!video.paused) {
                    video.pause();
                }
            });

            featuredDotEls.forEach((dot, i) => {
                dot.classList.toggle('is-active', i === index);
            });

            // Fade the matching caption in; the others fade out.
            featuredCaptionEls.forEach((caption, i) => {
                const isOn = i === index;
                caption.classList.toggle('is-active', isOn);
                caption.setAttribute('aria-hidden', isOn ? 'false' : 'true');
            });

            // Hide the arrow that can't go any further.
            if (featuredPrev) featuredPrev.disabled = index === 0;
            if (featuredNext) featuredNext.disabled = index === max;

            // Any change (manual or automatic) restarts the autoplay timer.
            scheduleAutoplay();
        }

        function setupFeaturedInput() {
            let animating = false;

            function step(direction) {
                const target = featuredIndex + direction;
                if (target < 0 || target > featuredSpaces.length - 1) return;
                goToFeatured(target);
                animating = true;
                setTimeout(() => { animating = false; }, SLIDE_MS);
            }

            // DESKTOP — arrow buttons (hidden on mobile via the CSS).
            // After a mouse click, drop focus from the arrow — otherwise the
            // browser keeps it "selected", and pressing a key later (e.g.
            // Shift for Shift + scroll) makes it show a focus ring.
            // (e.detail > 0 means it was a real click, not the keyboard.)
            function arrowClick(e, direction) {
                goToFeatured(featuredIndex + direction);
                if (e.detail > 0) e.currentTarget.blur();
            }
            if (featuredPrev) featuredPrev.addEventListener('click', (e) => arrowClick(e, -1));
            if (featuredNext) featuredNext.addEventListener('click', (e) => arrowClick(e, 1));

            // DESKTOP — Shift + wheel (or a sideways trackpad swipe).
            // A plain vertical wheel is ignored here, so the page scrolls
            // normally. Wheel events arrive in bursts (several per notch,
            // dozens per trackpad flick), so one continuous burst counts
            // as one gesture = one project.
            let lastWheelTime = 0;
            let gestureUsed = false;

            featuredHero.addEventListener('wheel', (e) => {
                const sideways = Math.abs(e.deltaX) > Math.abs(e.deltaY);
                if (!e.shiftKey && !sideways) return; // normal page scroll

                e.preventDefault();

                const now = performance.now();
                if (now - lastWheelTime > 150) gestureUsed = false;
                lastWheelTime = now;
                if (gestureUsed || animating) return;

                // Shift + wheel reports in deltaY on some browsers and
                // deltaX on others — use whichever carries the movement.
                const delta = sideways ? e.deltaX : e.deltaY;
                if (Math.abs(delta) < 4) return;

                gestureUsed = true;
                step(delta > 0 ? 1 : -1);
            }, { passive: false });

            // TOUCH — horizontal swipe. Vertical swipes are left alone
            // (the CSS sets touch-action: pan-y on the hero), so the page
            // still scrolls normally with a finger.
            let startX = 0;
            let startY = 0;
            let tracking = false;

            featuredHero.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) { tracking = false; return; }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            featuredHero.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                const touch = e.changedTouches[0];
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                    step(dx < 0 ? 1 : -1);
                }
            }, { passive: true });

            featuredHero.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
        }

        // Pauses the active video while the hero is scrolled out of view
        // and resumes it when it comes back.
        function setupHeroVisibility() {
            if (!('IntersectionObserver' in window)) return;
            const observer = new IntersectionObserver(([entry]) => {
                heroInView = entry.isIntersecting;
                scheduleAutoplay();
                const video = featuredSpaces[featuredIndex] && featuredSpaces[featuredIndex].querySelector('video');
                if (!video) return;
                if (heroInView) playVideo(video);
                else if (!video.paused) video.pause();
            }, { threshold: 0 });
            observer.observe(featuredHero);
        }

        buildFeaturedHero();

        // ---------------------------------------------------------------
        // MORE PROJECTS GRID — hover reveals a short description (and a
        // "click to see credits" hint) on the tile itself; clicking opens
        // the full project (with credits) in a lightbox. On touch devices
        // (no hover), the tile currently centered in the viewport as the
        // user scrolls gets the same reveal automatically.
        // ---------------------------------------------------------------
        const moreProjectsGrid = document.getElementById('moreProjectsGrid');

        function buildGrid() {
            moreProjectsGrid.innerHTML = '';

            gridData.forEach((project, i) => {
                const tile = document.createElement('div');
                tile.className = 'grid-tile';

                const mediaEl = renderMedia(project, 'grid-media');

                tile.innerHTML = `
                    <div class="grid-media-wrapper">
                        ${mediaEl}
                    </div>
                    <div class="grid-overlay">
                        <p class="grid-subtitle">${project.subtitle}</p>
                        <h3 class="grid-title">${project.title}</h3>
                        <p class="grid-description">${project.description}</p>
                        <p class="grid-hint">Click to see credits</p>
                    </div>
                `;

                tile.addEventListener('click', () => openLightbox(i));
                moreProjectsGrid.appendChild(tile);
            });

            setupInViewObserver();
        }

        // ---------------------------------------------------------------
        // LIGHTBOX — opened when a grid tile is clicked. Media stays a
        // fixed size; the info panel below it (description + credits)
        // scrolls independently if it's taller than the available space.
        //
        // HISTORY HANDLING — opening the lightbox pushes a history entry.
        // That means the browser's back button closes the lightbox and
        // lands back on the Projects page (instead of leaving the page
        // entirely, e.g. back to the Home page). Closing the lightbox any
        // other way (X button, clicking outside, Escape) calls
        // history.back() itself so that pushed entry gets cleaned up and
        // a second back-button press isn't needed later.
        // --------------------------------------------------------------
        const projectLightbox = document.getElementById('projectLightbox');
        const lightboxMedia = document.getElementById('lightboxMedia');
        const lightboxInfo = document.getElementById('lightboxInfo');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxBackdrop = document.getElementById('lightboxBackdrop');

        let lightboxHistoryPushed = false;

        function slugify(str) {
            return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        function openLightbox(index) {
            const project = gridData[index];
            if (!project) return;

            const lightboxMediaSource = {
                type: project.lightboxType || project.type,
                src: project.lightboxSrc || project.src,
                title: project.title
            };

            // eager: the lightbox is on screen the moment it opens.
            lightboxMedia.innerHTML = renderMedia(lightboxMediaSource, 'lightbox-media-el', { eager: true });

            lightboxInfo.innerHTML = `
                <p class="slide-subtitle">${project.subtitle}</p>
                <h2 class="slide-title">${project.title}</h2>
                <p class="slide-description">${project.description}</p>
                ${renderActionButtons(project)}
                <div class="slide-credits">
                    <p class="credits-label">CREDITS</p>
                    ${renderCreditsRows(project.credits)}
                </div>
            `;

            resolveVideoSources(lightboxMedia);

            // A self-hosted video in the lightbox no longer has autoplay,
            // so start it explicitly.
            const lbVideo = lightboxMedia.querySelector('video');
            if (lbVideo) {
                const p = lbVideo.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            }

            projectLightbox.classList.add('active');
            document.body.classList.add('lightbox-open');
            document.body.style.overflow = 'hidden';

            // Push a history entry so the back button closes the lightbox
            // instead of navigating away from the Projects page.
            history.pushState({ lightbox: true }, '', `#${slugify(project.title)}`);
            lightboxHistoryPushed = true;
        }

        function closeLightbox(fromPopState) {
            projectLightbox.classList.remove('active');
            document.body.classList.remove('lightbox-open');
            document.body.style.overflow = 'auto';
            lightboxMedia.innerHTML = '';
            scheduleAutoplay();

            if (lightboxHistoryPushed) {
                lightboxHistoryPushed = false;
                // If we're not already responding to a popstate (i.e. the
                // person closed the lightbox by clicking X / outside /
                // Escape), undo the history entry we pushed when opening
                // it so the URL/history stack stays clean.
                if (!fromPopState) {
                    history.back();
                }
            }
        }

        // Back-button support: closes the lightbox instead of leaving the page.
        window.addEventListener('popstate', () => {
            if (projectLightbox.classList.contains('active')) {
                closeLightbox(true);
            }
        });

        lightboxClose.addEventListener('click', () => closeLightbox(false));
        lightboxBackdrop.addEventListener('click', () => closeLightbox(false));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && projectLightbox.classList.contains('active')) {
                closeLightbox(false);
            }
        });

        // ---------------------------------------------------------------
        // TOUCH "IN VIEW" REVEAL — on devices without hover, whichever
        // tile is centered in the viewport as the person scrolls gets its
        // info revealed automatically, standing in for hover.
        // ---------------------------------------------------------------
        function setupInViewObserver() {
            if (!window.matchMedia('(hover: none)').matches) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    entry.target.classList.toggle('in-view', entry.isIntersecting);
                });
            }, {
                root: null,
                rootMargin: '-40% 0px -40% 0px',
                threshold: 0
            });

            document.querySelectorAll('.grid-tile').forEach(tile => observer.observe(tile));
        }

        buildGrid();

        // Nav scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('nav');
            if (window.pageYOffset > 100) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        }, { passive: true });

        // Mobile menu
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
            document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
        });

        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
                document.body.style.overflow = 'auto';
            });
        });
    </script>
</body>
</html>
