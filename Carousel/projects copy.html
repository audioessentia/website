<!DOCTYPE html>

<body>
    <nav id="nav">

            </button>
            <ul class="nav-links" id="navLinks">

                <li><a href="aboutus.html">ABOUT US</a></li>

            </ul>

    <main class="main-content">
        <section class="project-section" id="work">
            <div class="project-header">
                <h1 class="project-title">WORK</h1>
                <p class="project-subtitle">SELECTED PROJECTS</p>
            </div>

            <!-- Category filters -->
            <div class="filter-bar" id="filterBar"></div>

            <!-- Sub-nav: lists the projects within the active category, jumps to that slide -->
            <div class="sub-project-nav" id="subProjectNav">
                <ul class="sub-project-nav-links" id="subProjectNavLinks"></ul>
            </div>

            <div class="work-carousel" id="workCarousel">
                <div class="carousel-frame">
                    <button class="carousel-arrow prev" id="prevSlide" aria-label="Previous project">
                        <svg viewBox="0 0 24 24">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                        </svg>
                    </button>

                    <div class="carousel-viewport">
                        <div class="carousel-track" id="carouselTrack">
                            <!-- Slides are injected by JS from slidesData below -->
                        </div>
                    </div>

                    <button class="carousel-arrow next" id="nextSlide" aria-label="Next project">
                        <svg viewBox="0 0 24 24">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                        </svg>
                    </button>
                </div>

                <div class="carousel-footer">
                    <div class="carousel-counter">
                        <span id="counterCurrent">01</span>
                        <span class="counter-divider">/</span>
                        <span id="counterTotal">09</span>
                    </div>
                    <div class="carousel-dots" id="carouselDots"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div>
            <h3 class="footer-title">AUDIO ESSENTIA</h3>
            <p class="footer-text">EXPLORING CONSCIOUSNESS THROUGH SOUND</p>
            <a href="https://instagram.com/audioessentia/" target="_blank" style="display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; text-decoration: none; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" fill="#808080"/>
                </svg>
                <span style="color: #808080; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">@audioessentia</span>
            </a>
        </div>
    </footer>

    <script>
        // ---------------------------------------------------------------
        // PROJECT DATA
        // Replace `src` with real media per project (image path, video path,
        // or an embed URL). `type` controls how it's rendered:
        //   'image'  -> <img src="...">
        //   'video'  -> <video> for a self-hosted file (autoplays, muted, looped)
        //   'vimeo'  -> <iframe> using the player.vimeo.com URL from Vimeo's
        //               "Embed" share option
        //   'youtube'-> <iframe> using the youtube.com/embed/VIDEO_ID URL
        //               from YouTube's Share → Embed code (copy the src="..."
        //               value out of the <iframe> YouTube gives you — the
        //               normal youtube.com/watch?v=... link will NOT work here)
        //   'embed'  -> generic fallback, same iframe rendering, for any other
        //               host that gives you an embeddable iframe src
        // `category` drives the filter bar AND the sub-nav below it — keep to
        // one of the values listed in `categories` below (or add a new one
        // to both places).
        // `explore` (true/false) controls whether the EXPLORE button shows —
        // only set true for projects that have a real dedicated page to link to.
        // `link` is only used when explore is true.
        // `credits` is an array of [name, role] pairs shown under the description.
        // ---------------------------------------------------------------
        const categories = ["All", "Short Films", "Feature Films", "Redesigns"];

        const slidesData = [
            {
                title: "STRAIN",
                subtitle: "SOUND DESIGN",
                category: "Short Films",
                type: "image",
                src: "Media/Depths/Depths_1.JPG",
                description: "Placeholder description — replace with a short summary of Strain: format, role, and the sonic approach taken on the project.",
                explore: false,
                link: "",
                credits: [
                    ["Dan Hawryluk", "Sound Editor"],
                    ["John Gregory", "Re-Recording Mixer"]
                ]
            },
            {
                title: "DANCE MOM",
                subtitle: "SOUND DESIGN",
                category: "Short Films",
                type: "image",
                src: "Media/Depths/Depths_4.JPG",
                description: "Placeholder description — replace with a short summary of Dance Mom: format, role, and the sonic approach taken on the project.",
                explore: false,
                link: "",
                credits: [
                    ["Eloísa Sandoval García", "ADR Editor"],
                    ["Sidharth Satheesh", "Music Producer"]
                ]
            },
            {
                title: "KILLER VACANCY",
                subtitle: "SOUND DESIGN",
                category: "Short Films",
                type: "image",
                src: "Media/Depths/Depths_5.JPG",
                description: "Placeholder description — replace with a short summary of Killer Vacancy: format, role, and the sonic approach taken on the project.",
                explore: false,
                link: "",
                credits: [
                    ["Joel Tong", "Music Producer"],
                    ["Luz Salcedo", "Video Editor"]
                ]
            },
            {
                title: "KNIGHT TERROR",
                subtitle: "SOUND DESIGN",
                category: "Feature Films",
                type: "image",
                src: "Media/Depths/Depths_2.JPG",
                description: "Placeholder description — replace with a short summary of Knight Terror: format, role, and the sonic approach taken on the project.",
                explore: false,
                link: "",
                credits: [
                    ["Steven Tsia", "Sound Designer"],
                    ["Raine Edgar", "Technical Sound Designer"]
                ]
            },
            {
                title: "YONA",
                subtitle: "RE-DESIGN",
                category: "Redesigns",
                type: "image",
                src: "Media/Depths/Depths_6.jpg",
                description: "Placeholder description — replace with a short summary of the Yona sound re-design: scope, tools, and outcome.",
                explore: false,
                link: "",
                credits: [
                    ["Raine Edgar", "Technical Sound Designer"]
                ]
            },
            {
                title: "A SHAMAN'S TALE",
                subtitle: "ANIMATED SHORT FILM",
                category: "Redesigns",
                type: "vimeo",
                src: "https://player.vimeo.com/video/1114698558?badge=0&autopause=0&player_id=0&app_id=58479",
                description: "Sound design for an animated short film. Click through to the dedicated project page for the full breakdown and credits.",
                explore: true,
                link: "shamans.html",
                credits: [
                    ["Dan Hawryluk", "Creative Director"],
                    ["John Gregory", "Supervising Sound Editor"],
                    ["Luz Salcedo", "Lead Video Editor"]
                ]
            },
            {
                title: "AU REVOIR MON MONDE",
                subtitle: "RE-DESIGN",
                category: "Redesigns",
                type: "image",
                src: "Media/Depths/Depths_1.JPG",
                description: "Placeholder description — replace with a short summary of the Au Revoir Mon Monde sound re-design: scope, tools, and outcome.",
                explore: false,
                link: "",
                credits: [
                    ["Steven Tsia", "Sound Designer"]
                ]
            },
            {
                title: "WARFRAME: A NEW WAR",
                subtitle: "SOUND REDESIGN",
                category: "Redesigns",
                type: "image",
                src: "Media/Depths/Depths_2.JPG",
                description: "Placeholder description — replace with a short summary of the Warframe: A New War sound redesign: scope, tools, and outcome.",
                explore: true,
                link: "",
                credits: [
                    ["Sidharth Satheesh", "Media Composer"],
                    ["Joel Tong", "Music Producer"]
                ]
            },
            {
                title: "MARATHON REVEAL CINEMATIC",
                subtitle: "SOUND REDESIGN",
                category: "Redesigns",
                type: "image",
                src: "Media/Depths/Depths_6.jpg",
                description: "Placeholder description — replace with a short summary of the Marathon Reveal Cinematic sound redesign: scope, tools, and outcome.",
                explore: false,
                link: "",
                credits: [
                    ["Joel Tong", "Music Producer"]
                ]
            }
        ];

        // ---------------------------------------------------------------
        // STATE
        // ---------------------------------------------------------------
        let activeCategory = "All";
        let currentIndex = 0;
        let autoplayTimer = null;

        const track = document.getElementById('carouselTrack');
        const dotsContainer = document.getElementById('carouselDots');
        const counterCurrent = document.getElementById('counterCurrent');
        const counterTotal = document.getElementById('counterTotal');
        const filterBar = document.getElementById('filterBar');
        const subProjectNavLinks = document.getElementById('subProjectNavLinks');
        const carouselEl = document.getElementById('workCarousel');

        function pad(n) {
            return n < 10 ? `0${n}` : `${n}`;
        }

        function getFilteredSlides() {
            return activeCategory === "All"
                ? slidesData
                : slidesData.filter(s => s.category === activeCategory);
        }

        // ---------------------------------------------------------------
        // FILTER BAR
        // ---------------------------------------------------------------
        function buildFilterBar() {
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = cat;
                btn.dataset.category = cat;
                if (cat === activeCategory) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    activeCategory = cat;
                    currentIndex = 0;
                    updateFilterActiveState();
                    buildSlides();
                });
                filterBar.appendChild(btn);
            });
        }

        function updateFilterActiveState() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === activeCategory);
            });
        }

        // ---------------------------------------------------------------
        // SUB-NAV: project names within the active category
        // ---------------------------------------------------------------
        function buildSubNav() {
            subProjectNavLinks.innerHTML = '';
            const slides = getFilteredSlides();

            slides.forEach((slide, i) => {
                const li = document.createElement('li');
                const link = document.createElement('a');
                link.href = '#';
                link.textContent = slide.title;
                if (i === currentIndex) link.classList.add('active');
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    goToSlide(i);
                });
                li.appendChild(link);
                subProjectNavLinks.appendChild(li);
            });
        }

        function updateSubNavActiveState() {
            [...subProjectNavLinks.querySelectorAll('a')].forEach((link, i) => {
                link.classList.toggle('active', i === currentIndex);
            });
        }

        // ---------------------------------------------------------------
        // CAROUSEL BUILD
        // ---------------------------------------------------------------
        function buildSlides() {
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            const slides = getFilteredSlides();

            slides.forEach((slide, i) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'carousel-slide';

                let mediaEl;
                if (slide.type === 'video') {
                    mediaEl = `<video class="slide-media" src="${slide.src}" autoplay muted loop playsinline></video>`;
                } else if (slide.type === 'vimeo' || slide.type === 'youtube' || slide.type === 'embed') {
                    mediaEl = `<iframe class="slide-media" src="${slide.src}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media" allowfullscreen title="${slide.title}"></iframe>`;
                } else {
                    mediaEl = `<img class="slide-media" src="${slide.src}" alt="${slide.title}">`;
                }

                const exploreBtn = slide.explore && slide.link
                    ? `<a href="${slide.link}" class="btn-explore">EXPLORE</a>`
                    : '';

                const creditsRows = slide.credits.map(([name, role]) => `
                    <div class="credit-row">
                        <span class="credit-name">${name}</span>
                        <span class="credit-role">${role}</span>
                    </div>
                `).join('');

                slideEl.innerHTML = `
                    <div class="slide-media-wrapper">
                        ${mediaEl}
                    </div>
                    <div class="slide-info">
                        <p class="slide-subtitle">${slide.subtitle} &middot; ${slide.category}</p>
                        <h2 class="slide-title">${slide.title}</h2>
                        <p class="slide-description">${slide.description}</p>
                        ${exploreBtn}
                        <div class="slide-credits">
                            <p class="credits-label">CREDITS</p>
                            ${creditsRows}
                        </div>
                    </div>
                `;
                track.appendChild(slideEl);

                const dot = document.createElement('button');
                dot.className = 'carousel-dot';
                dot.setAttribute('aria-label', `Go to ${slide.title}`);
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });

            counterTotal.textContent = pad(slides.length || 0);
            currentIndex = Math.min(currentIndex, Math.max(slides.length - 1, 0));
            buildSubNav();
            updateCarousel();
        }

        function updateCarousel() {
            track.style.transform = `translateX(-${currentIndex * 100}%)`;
            counterCurrent.textContent = pad(currentIndex + 1);

            document.querySelectorAll('.carousel-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });

            updateSubNavActiveState();
        }

        function goToSlide(index) {
            const total = getFilteredSlides().length;
            if (total === 0) return;
            currentIndex = (index + total) % total;
            updateCarousel();
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        document.getElementById('nextSlide').addEventListener('click', nextSlide);
        document.getElementById('prevSlide').addEventListener('click', prevSlide);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
        });

        // Optional autoplay — pauses while the pointer is over the carousel.
        // `isHovering` is checked inside the tick itself (not just via
        // clearInterval) so a tick that was already queued right as the
        // pointer enters can't sneak a slide change past a click.
        let isHovering = false;

        function autoplayTick() {
            if (!isHovering) nextSlide();
        }

        function startAutoplay() {
            clearInterval(autoplayTimer);
            autoplayTimer = setInterval(autoplayTick, 7000);
        }

        startAutoplay();

        carouselEl.addEventListener('mouseenter', () => {
            isHovering = true;
            clearInterval(autoplayTimer);
        });

        carouselEl.addEventListener('mouseleave', () => {
            isHovering = false;
            startAutoplay();
        });

        buildFilterBar();
        buildSlides();

        // Nav scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('nav');
            if (window.pageYOffset > 100) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // Mobile menu
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
            document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
        });

        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
                document.body.style.overflow = 'auto';
            });
        });
    </script>
</body>
