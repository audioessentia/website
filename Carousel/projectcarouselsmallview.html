<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <nav id="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">AUDIO ESSENTIA</a>
            <button class="mobile-menu-toggle" id="menuToggle">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">HOME</a></li>
                <li><a href="projects.html" class="active">PROJECTS</a></li>
                <li><a href="aboutus.html">ABOUT US</a></li>
                <li><a href="calendar.html">EVENT CALENDAR</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <section class="project-section" id="work">
            <div class="project-header">
                <h1 class="project-title">FEATURED PROJECTS</h1>
            </div>

            <!-- Featured carousel: full-bleed media, PREVIOUS CLIP / NEXT UP
                 text navigation, collapsible CREDITS toggle, and a filmstrip
                 of thumbnails below to jump between projects — all injected
                 by JS below to mirror markclennon.com/motion's clip pages. -->
            <div class="work-carousel" id="workCarousel">
                <div class="carousel-viewport">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Slides are injected by JS from carouselData below -->
                    </div>
                </div>
            </div>

            <div class="carousel-filmstrip" id="carouselFilmstrip">
                <!-- Thumbnails injected by JS from carouselData below -->
            </div>
        </section>

        <!-- ---------------------------------------------------------------
             MORE PROJECTS — hover-reveal grid, everything not in the
             carousel above. Hover any tile to see a short description;
             click opens the full project (with credits) in a lightbox.
        --------------------------------------------------------------- -->
        <section class="more-projects-section" id="moreProjects">
            <div class="more-projects-header">
                <h2 class="more-projects-title">MORE PROJECTS</h2>
            </div>
            <div class="more-projects-grid" id="moreProjectsGrid">
                <!-- Tiles are injected by JS from gridData below -->
            </div>
        </section>
    </main>

    <!-- ---------------------------------------------------------------
         PROJECT LIGHTBOX — opened when a "More Projects" tile is clicked.
         Media stays fixed size; the info panel below it scrolls.
    --------------------------------------------------------------- -->
    <div class="project-lightbox" id="projectLightbox">
        <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="lightbox-content">
            <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
            <div class="lightbox-scroll">
                <div class="lightbox-media" id="lightboxMedia"></div>
                <div class="lightbox-info" id="lightboxInfo"></div>
            </div>
        </div>
    </div>

    <footer>
        <div>
            <h3 class="footer-title">AUDIO ESSENTIA</h3>
            <p class="footer-text">EXPLORING CONSCIOUSNESS THROUGH SOUND</p>
            <a href="https://instagram.com/audioessentia/" target="_blank" style="display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; text-decoration: none; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">
