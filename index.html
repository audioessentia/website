<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Essentia</title>
    <link rel="stylesheet" href="indexcss.css">
</head>
<body>

    <nav id="nav">
        <div class="nav-container">
            <div class="logo">AUDIO ESSENTIA</div>
            <button class="mobile-menu-toggle" id="menuToggle">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">PROJECTS</a></li>
                <li><a href="aboutus.html">ABOUT US</a></li>
                <li><a href="calendar.html">EVENT CALENDAR</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <section class="projects" id="home">
        <div class="projects-grid">
            <div class="project-card">
                <div class="project-image" style="background-image: url('/Media/Depths/Depths_2.JPG'); background-color: #2a2a2a;"></div>
                <div class="project-overlay">
                    <h3 class="project-title">DEPTHS</h3>
                    <p class="project-subtitle">4D SOUND INSTALLATION</p>
                    <p class="project-description">
                        Immersive audiovisual journey.
                    </p>
                    <a href="depths.html" class="btn-explore">EXPLORE</a>
                </div>
            </div>

            <div class="project-card">
                <div class="project-image" style="background-image: url('/Media/HomeStudio.jpg'); background-color: #2a2a2a;"></div>
                <div class="project-overlay">
                    <h3 class="project-title">A SHAMAN'S TALE</h3>
                    <p class="project-subtitle">SOUND DESIGN</p>
                    <p class="project-description">
                        Animated short film.
                    </p>
                    <a href="shamans.html" class="btn-explore">EXPLORE</a>
                </div>
            </div>
        </div>
    </section>
    
    <footer>
        <div>
            <h3 class="footer-title">AUDIO ESSENTIA</h3>
            <p class="footer-text">TRANSFORMING CONSCIOUSNESS THROUGH SOUND</p>
        </div>
    </footer>

    <script>

        // Mobile Menu
        function initializeMobileMenu() {
            const navContainer = document.querySelector('.nav-container');
            const navLinks = document.querySelector('.nav-links');
            const hamburger = document.querySelector('.mobile-menu-toggle');

            hamburger.addEventListener('click', function() {
                this.classList.toggle('active');
                navLinks.classList.toggle('active');
                document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
            });

            const navLinkItems = document.querySelectorAll('.nav-links a');
            navLinkItems.forEach(link => {
                link.addEventListener('click', function() {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            });

            document.addEventListener('click', function(event) {
                if (!navContainer.contains(event.target) && navLinks.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && navLinks.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initializeMobileMenu);

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    document.getElementById('navLinks').classList.remove('active');
                    document.querySelector('.mobile-menu-toggle').classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        });
    </script>
</body>
</html>
