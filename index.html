    <!-- ---------------------------------------------------------------
         HERO — DEPTHS takeover. Background photos cross-fade behind a
         dark gradient (see .hero::before in the CSS).

         PERFORMANCE:
         - Every slide lists its photo in data-bg. The first one loads
           right away; each of the others loads one slide ahead of when
           it's shown, so the page only downloads one photo up front.
         - On phones (768px wide or less) each slide uses the smaller
           "-mobile" copy instead (Depths_2.webp -> Depths_2-mobile.webp),
           worked out automatically. If a -mobile file doesn't exist,
           the full-size photo is used instead, so nothing breaks.
         To add a slide: copy a line and change data-bg.

    <section class="hero" id="hero">

    <script>

        // Mobile Menu
        function initializeMobileMenu() {
            const navContainer = document.querySelector('.nav-container');
            const navLinks = document.querySelector('.nav-links');
            const hamburger = document.querySelector('.mobile-menu-toggle');

            hamburger.addEventListener('click', function() {
                this.classList.toggle('active');
                navLinks.classList.toggle('active');
                document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
            });

            const navLinkItems = document.querySelectorAll('.nav-links a');
            navLinkItems.forEach(link => {
                link.addEventListener('click', function() {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                });
            });

            document.addEventListener('click', function(event) {
                if (!navContainer.contains(event.target) && navLinks.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && navLinks.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initializeMobileMenu);

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    document.getElementById('navLinks').classList.remove('active');
                    document.querySelector('.mobile-menu-toggle').classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        });

        // ---------------------------------------------------------------
        // Hero background slideshow — cross-fades through the slides
        // automatically. Change SLIDE_INTERVAL_MS to change the pace.
        // Each slide's photo is loaded one step ahead of when it's shown
        // (a full interval of lead time), so it's ready before it fades in.
        //
        // MOBILE: on screens 768px wide or less, the "-mobile" copy is
        // tried first (always .webp). If it's missing, the full-size
        // photo is used. Set USE_MOBILE_MEDIA to false to switch off.
        // ---------------------------------------------------------------
        (function initHeroSlideshow() {
            const SLIDE_INTERVAL_MS = 8000;
            const USE_MOBILE_MEDIA = true;
            const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches;

            const slides = document.querySelectorAll('.hero-bg-slide');
            if (!slides.length) return;

            function mobileSrc(src) {
                if (!USE_MOBILE_MEDIA || !IS_MOBILE) return src;
                const dot = src.lastIndexOf('.');
                if (dot === -1) return src;
                const base = src.slice(0, dot);
                return base.endsWith('-mobile') ? src : base + '-mobile.webp';
            }

            function setBg(slide, src) {
                slide.style.backgroundImage = `url('${src}')`;
            }

            // Loads a slide's photo (once). The photo is fetched through a
            // hidden Image first, so a missing -mobile copy can be detected
            // and the full-size one used instead; the browser then reuses
            // the downloaded file for the background.
            function loadSlide(slide) {
                const full = slide.dataset.bg;
                if (!full) return;
                delete slide.dataset.bg;

                const preferred = mobileSrc(full);
                if (preferred === full) {
                    setBg(slide, full);
                    return;
                }
                const probe = new Image();
                probe.onload = () => setBg(slide, preferred);
                probe.onerror = () => setBg(slide, full);
                probe.src = preferred;
            }

            // First photo right away; the second once the page has loaded.
            loadSlide(slides[0]);
            if (slides.length < 2) return;
            window.addEventListener('load', () => loadSlide(slides[1]));

            let currentSlide = 0;
            setInterval(() => {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                loadSlide(slides[currentSlide]); // safety net if 'load' hadn't fired yet
                slides[currentSlide].classList.add('active');
                loadSlide(slides[(currentSlide + 1) % slides.length]);
            }, SLIDE_INTERVAL_MS);
        })();
    </script>
